name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      # F62 — the debug variant has minification off, so it never exercises the ProGuard/Gson
      # risk documented in proguard-rules.pro (R8 stripping a DTO field or a TypeToken generic
      # signature). No keystore is available in CI, so this debug-signs per the fallback in
      # app/build.gradle.kts (F68) — still exercises R8, just not the real release signing.
      # (AGP only generates unit test tasks for the configured testBuildType — debug here — so
      # there's no testReleaseUnitTest to run; assembleRelease alone still runs R8/ProGuard.)
      - name: Build release variant
        run: ./gradlew assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
